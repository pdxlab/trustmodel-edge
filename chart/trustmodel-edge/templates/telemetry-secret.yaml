{{- /*
TRUS-2002 — subject pseudonymization key Secret. Only rendered for an inline
telemetry.subjectHashKey; customers who manage secrets out-of-band set
telemetry.subjectHashKeyExistingSecret instead and this is skipped.
*/ -}}
{{- if and .Values.telemetry.subjectHashKey (not .Values.telemetry.subjectHashKeyExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trustmodel-edge.fullname" . }}-telemetry
  labels:
    {{- include "trustmodel-edge.labels" . | nindent 4 }}
type: Opaque
stringData:
  subject-hash-key: {{ .Values.telemetry.subjectHashKey | quote }}
{{- end }}
